# ResearchMesh-Windows, a Windows CLI Research Client for Claude — configuration.
#
# Non-secret settings only. MCP bearer tokens are NOT stored here: each server
# names the environment variable that holds its token (see README.md).

[claude]
# Anthropic model to use. The CLAUDE_MODEL environment variable overrides this.
model = "claude-sonnet-5"

[mcp]
# Set enabled = false to skip every MCP server and run with local tools only.
enabled = false

# MCP servers to connect to. Every reachable/launchable one connects and its
# tools are merged into the single list Claude sees; one that fails prints a
# warning and is skipped, so it doesn't stop the app. Two entry shapes:
#
# 1) Streamable HTTP (a server already running elsewhere, reached over the network):
#   name       label used as the client id and in messages
#   url        the server's Streamable HTTP endpoint
#   token_env  optional — the environment variable holding this server's bearer
#              token. Omit for a server that needs no auth. Never put the token
#              itself here; this file is committed.
#
# 2) stdio (a local server main.py launches itself as a subprocess, talking
#    JSON-RPC over stdin/stdout — no port, no separate process to start by hand):
#   name       label used as the client id and in messages
#   command    full argv as a list, e.g. ["node", "/path/to/bin.js"]
#   env        optional table of extra environment variables for the
#              subprocess (merged with a safe default set — PATH, HOME, etc.
#              — by the MCP SDK; you only need to list the extras).
#
# `enabled` (optional, default true) works on either shape — park a server
# without deleting its line.
#
# Paths and URLs are expanded before use: `~`, `%VAR%`, `$VAR` and `${VAR}` in
# `command`, `url` and the *values* of `env` are substituted from the
# environment (main.py `_expand_paths`), so nobody's username has to be baked
# into this file. `env`'s keys are variable names and are left alone. An
# undefined variable is left as written rather than becoming empty, so a typo
# shows up in the startup warning instead of producing a silently wrong path.
#
# Use the Windows variable names — `%USERNAME%`, `%USERPROFILE%`, `%APPDATA%`,
# `%LOCALAPPDATA%`, `%ProgramFiles%`. Both `%VAR%` and `$VAR` syntax are
# accepted; a name that is not set is left as written rather than emptied.
#
# Backslashes: TOML treats `\` as an escape in a basic "quoted" string, so
# "C:\Users\me" is invalid TOML. Either use forward slashes ("C:/Users/me",
# which every Windows API accepts) or a literal single-quoted string
# ('C:\Users\me'). Forward slashes are used below.
#
# Order is precedence. If two servers offer the same tool name, the first
# entry listed wins — `ToolManager._tool_owners` resolves owners by insertion
# order — and the loser's copy is unreachable rather than reported. Keep
# epic-official-mcp above unreal for that reason: the fork below was deduped
# against Epic's toolsets, so Epic is the canonical owner of anything the two
# might ever both expose.
#
# The absolute paths below are still machine-specific — be sure you change
# these for your servers. Every entry is commented out by default so a fresh
# clone starts clean; uncomment the ones you actually run and set
# `enabled = true` above.
servers = [
#  { name = "n8n",    url = "http://192.168.2.12:5678/mcp-server/http", token_env = "N8N_MCP_TOKEN" }, # works
#  { name = "alpaca", url = "http://192.168.2.12:8000/mcp" }, # works https://github.com/alpacahq/alpaca-mcp-server
#  { name = "unity", command = ["C:/Users/%USERNAME%/.unity/relay/relay_windows.exe", "--mcp", "--project-path", "D:/unity-projects/Burger_Order_Match_Stack"] },
#  { name = "vs-code", url = "http://127.0.0.1:3000/mcp" }, # works
#  { name = "blender", url = "http://127.0.0.1:8033/" }, # works https://projects.blender.org/lab/blender_mcp/src/branch/main/mcp
#  { name = "epic-official-mcp", url = "http://127.0.0.1:8000/mcp" }, # works, uses epic_official_mcp.md
  # ^ Epic's own official Unreal MCP plugin, served by the running editor —
  #   there is no separate process to start, and nothing listens on :8000
  #   until UE 5.8.1 is open with the plugin enabled, so expect a connect
  #   warning and a skip otherwise. It exposes toolsets rather than a flat
  #   tool list, and which ones appear depends on the project's enabled
  #   plugins — so the set grows as you enable more (see the NEW markers in
  #   epic_official_mcp.md).
#  { name = "unreal", command = ["node", "D:/unreal-mcp-additional-tools/dist/bin.js", "--project-path", "D:/Unreal-Projects/5.8.1-Projects/Test_MCP_Project/Test_MCP_Project.uproject", "--engine-path", "D:/UE_5.8.1"], env = {DOTNET_ROOT = "D:/UE_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/win-x64",DOTNET_ROOT_X64 = "D:/UE_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/win-x64"}},
  # ^ works, uses unreal_management.md — this is nodormu/unreal-mcp-additional-tools
  #   (https://github.com/nodormu/unreal-mcp-additional-tools), forked from
  #   sam-david/unreal-mcp and deduplicated against Epic's official server so the two
  #   form a clean union with no functional overlap — stdio transport, confirmed
  #   present & runnable at that path (built dist/bin.js exists, `node dist/bin.js`
  #   launches and blocks on stdin as expected for an MCP stdio server).
  #   Needs UE 5.x open with its editor's Python Editor Script Plugin's "Enable Remote
  #   Execution" checked (see the repo README) for most tools to actually work end-to-end;
  #   the connection itself doesn't require that.
  #   If you want it scoped to one Unreal project, uncomment and fill in the env line below
  #   (or drop a .unrealmcp.json with {"projectPath": "."} in that project's directory instead —
  #   see the repo README's "Config File" section for the full set of optional keys):
  #   { name = "unreal", command = ["node", "D:/unreal-mcp-additional-tools/dist/bin.js"],
  #     env = { UNREAL_MCP_PROJECT_PATH = "/path/to/YourProject.uproject" } },
]

# For a local stdio MCP server passed on the command line instead of listed
# above (equivalent to a `command` entry, but only for a Python script):
#   python main.py path/to/server.py

[embeddings]
# There is no Anthropic-hosted embeddings endpoint — the documented path is
# Voyage AI, a separate paid API. The `text_embeddings` tool exists so Claude
# has vector embeddings available at all without adding that second bill:
# uncomment `url` below and it calls whatever HTTP embedding server you
# already run instead — the same private compute an Unreal Engine project's
# own embedding settings might already point at, or any self-hosted server
# speaking the common OpenAI-compatible `/v1/embeddings` shape
# (text-embeddings-inference, llama.cpp's server, Ollama, vLLM, LM Studio, ...).
#
# Like everything else in this file, it's read fresh on every call — editing
# this block (by hand or with the `config_edit` tool) and calling
# `text_embeddings` again picks it up with no restart.
#
#   url             your embedding server's endpoint. Required — the tool is
#                   still declared to Claude either way, but returns an error
#                   telling you to set this until you do.
#   model           optional model name forwarded in the request body. Most
#                   single-model private servers ignore it; leave it unset if
#                   yours does. Overridable per call.
#   request_format  "openai" (default) posts {"input": [...], "model": ...}
#                   and expects {"data": [{"embedding": [...]}, ...]} back —
#                   the shape most self-hosted servers speak. "simple" posts
#                   {"text": [...]} instead, for a bespoke server that wants
#                   that shape. Either way, a response of
#                   {"embedding": [...]} or {"embeddings": [[...]]} is also
#                   accepted regardless of which format was sent.
#   api_key_env     optional — name of the environment variable holding a
#                   bearer token for this server, the same `token_env`
#                   pattern an `[mcp].servers` entry uses. Never put the
#                   token itself here; this file is committed.
#   timeout         optional request timeout in seconds (default 30).
#
# Nothing above is specific to self-hosted compute — it's the same generic
# OpenAI-compatible /v1/embeddings shape, so a paid provider works with zero
# code changes too. Voyage AI is one example:
#
#   url = "https://api.voyageai.com/v1/embeddings"
#   model = "voyage-2"                  # or voyage-3.5, voyage-large-2, ...
#   api_key_env = "VOYAGE_API_KEY"      # set VOYAGE_API_KEY in your shell,
#                                        # never here — this file is committed
#
# The example below instead points at a self-hosted server on the LAN — swap
# in whatever you actually run (same 192.168.2.12 example host used by the
# n8n/alpaca entries above). This is the shape the tool was verified against:
# llama.cpp's `llama-server` serving a nomic embedding model, which ignores
# `model` entirely — most single-model servers do, so drop that line if yours
# does too:
# url = "http://192.168.2.12:8080/v1/embeddings"
# model = "nomic-embed"
# request_format = "openai"
# api_key_env = "EMBEDDINGS_API_KEY"
# timeout = 30

[vision]
# Same self-hosting motivation as [embeddings] above, for a different
# modality: the `vision_query` tool asks a question about an image via your
# own OpenAI-compatible vision-capable chat server (llama.cpp's server,
# vLLM, LM Studio, ...) instead of sending the image to Anthropic's API.
#
# Like [embeddings], this is read fresh on every call — editing this block
# and calling `vision_query` again picks it up with no restart.
#
# IMPORTANT — no automatic fallback to Claude's own vision lives in this
# tool. If url is unset here, or the request to it fails (server down,
# unreachable, etc.), vision_query returns a plain
# {"status": "local_unavailable", ...} result and stops — it does NOT
# silently retry via Claude. Using Claude's own vision on the same image
# after that is a deliberate, separate decision made in conversation (with
# your explicit go-ahead), never automatic — see core/vision.py's module
# docstring for the full reasoning.
#
#   url          your vision server's OpenAI-compatible chat endpoint,
#                e.g. http://host:port/v1/chat/completions. Required — the
#                tool is still declared to Claude either way, but returns
#                a local_unavailable status telling you to set this until
#                you do.
#   model        model name forwarded in the request body — must match
#                your server's routing/alias name (e.g. a models.ini
#                bracket name in llama.cpp router mode), not necessarily
#                the .gguf filename. Overridable per call.
#   max_tokens   default max output tokens (default 4000 if unset here).
#                Confirmed empirically necessary at this magnitude for
#                GLM-4.6V-Flash specifically: it's a reasoning model that
#                spends part of the budget on invisible reasoning_content
#                before writing the visible answer — at low values
#                (tested: 400-500) it can burn the ENTIRE budget on
#                reasoning and return an empty or mid-sentence-truncated
#                answer with no error, only a "finish_reason": "length" in
#                the raw response to tell you why. If you swap in a
#                non-reasoning vision model later, a much lower value would
#                likely be fine — this default is tuned for THIS model,
#                not a universal constant. Overridable per call.
#   timeout      request timeout in seconds (default 180 if unset here).
#                Real test data point: max_tokens=4000 on a moderately
#                complex image used 1536 tokens and took 43s on the
#                7800 XT this was tuned against (~35.7 tok/s combined
#                reasoning+generation) — a call that actually used the
#                FULL 4000-token budget would extrapolate to roughly
#                110s, so 180s leaves real headroom rather than cutting it
#                close. Adjust freely if your hardware/model differs.
#   api_key_env  optional — same bearer-token env-var pattern as
#                [embeddings].api_key_env. Never put the token itself
#                here; this file is committed.
#
# The example below points at the same self-hosted llama.cpp router
# [embeddings] above already uses, now also serving a vision-capable model
# alongside the embedding one (llama.cpp's own router/--models-preset mode
# runs both behind one port) — swap in whatever you actually run:
# url = "http://192.168.2.12:8080/v1/chat/completions"
# model = "glm-4.6v-flash"
# max_tokens = 4000
# timeout = 180
# api_key_env = "VISION_API_KEY"

[speak]
# Local text-to-speech: the `speak` tool synthesizes text with your own
# Piper voice model and plays it back through your default (or chosen)
# audio output device. Nothing is sent anywhere — this is 100% local,
# unlike [embeddings]/[vision] above which call an HTTP server. It does
# nothing until `voice_model` below is set. See core/speak.py's module
# docstring for the full reasoning, including why this Windows port
# synthesizes in-process via `piper.PiperVoice` and plays back with
# `sounddevice`/`soundfile`, rather than shelling out the way the Linux
# version does (`python3 -m piper` + `paplay`, neither of which has a
# Windows equivalent).
#
#   enabled       set to false to mute speak entirely without touching
#                 voice_model (default true).
#   voice_model   path to a Piper .onnx voice file. Requires a matching
#                 sidecar at "<voice_model>.json" (Piper's own convention).
#                 Download voices from
#                 https://github.com/rhasspy/piper/blob/master/VOICES.md —
#                 grab both the .onnx and .onnx.json for the same voice.
#                 Overridable per call via the tool's `voice` argument.
#   sink          optional sounddevice OUTPUT device: a numeric index or a
#                 substring of the device name (see `python -m sounddevice`
#                 to list what Windows sees). Leave unset to play through
#                 the system default output device.
#   timeout       seconds before an in-progress playback is force-stopped
#                 as a safety cap (default 30). Synthesis itself has no
#                 separate timeout — it's bounded by text length, not by a
#                 subprocess that can hang.
#
# Backslashes: TOML treats `\` as an escape in a basic "quoted" string, so
# "C:\Users\me\voice.onnx" is invalid TOML — use forward slashes
# ("C:/Users/me/voice.onnx") or a literal single-quoted string instead.
#
# enabled = true
# voice_model = "C:/Users/%USERNAME%/piper-voices/en_US-lessac-medium.onnx"
# sink = "Headphones"
# timeout = 30
enabled = true
voice_model = "C:/Users/invent/piper-voices/en_US-lessac-medium.onnx"

[listen]
# Local speech-to-text: the `listen` tool records a bounded window from
# your microphone and transcribes it with `faster-whisper`, entirely on
# CPU — no cloud STT. Nothing is sent anywhere. Unlike the Linux version,
# `device` is OPTIONAL here: Windows/sounddevice already has a working
# notion of a default input device, so this can work with NO configuration
# at all as long as a microphone exists. See core/listen.py's module
# docstring for the full reasoning, including why capture goes through
# `sounddevice.rec(...)` in-process rather than shelling out to
# `parecord`/`timeout` the way the Linux version does (neither exists on
# Windows, and there's no PipeWire source-name concept to configure here).
#
#   enabled                  set to false to keep the microphone closed
#                             entirely without touching `device` (default
#                             true).
#   device                   optional sounddevice INPUT device: a numeric
#                             index or a substring of the device name (see
#                             `python -m sounddevice` to list what Windows
#                             sees). Leave unset to use the system default
#                             microphone. Overridable per call via the
#                             tool's `device` argument.
#   default_duration_seconds how long to record when the tool call doesn't
#                             specify `duration_seconds` (default 8).
#   max_duration_seconds     hard safety cap regardless of what's
#                             requested, tool call or config (default 30).
#   model_size                faster-whisper model size — "tiny", "base",
#                             "small", "medium", "large-v3", etc. Bigger is
#                             more accurate and slower; "base" is a
#                             reasonable CPU default (default "base").
#   samplerate                capture sample rate in Hz (default 16000,
#                             which is what Whisper models are trained on —
#                             no reason to raise this unless a specific
#                             microphone refuses to open at 16kHz).
#
# enabled = true
# device = "Razer"
# default_duration_seconds = 8
# max_duration_seconds = 30
# model_size = "base"
# samplerate = 16000
enabled = true
