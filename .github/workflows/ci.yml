name: CI

# Deliberately narrow. This project's tools drive a real desktop, a real
# browser, LibreOffice and a paid API, none of which belong on a CI runner —
# so CI checks the wiring, not the behaviour: does everything import, is the
# tool registry well-formed, do the docs still agree with the code, and does
# the MCP server complete a handshake. See smoke_test.py for the reasoning.
#
# No secrets are used. `smoke_test.py` sets a placeholder ANTHROPIC_API_KEY,
# which is enough to start mcp_server.py and list its tools without ever
# reaching the Anthropic API.
#
# Both jobs run on Windows, because that is the only platform this project
# targets. This was originally the only place the code ran on Windows at all;
# it has since been driven hands-on on a real Windows box too, confirming
# `computer`, `speak`/`listen`, `document_convert` and `interactive_run` all
# actually work — but CI itself still only checks the wiring, not the tools'
# real-world behaviour, so treat a green run here as "it imports, wires up and
# handshakes", which is more than nothing and well short of "the tools work".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Two of these checks are genuinely platform-bound: mcp_server.py's stdout
    # guard imports `msvcrt` and calls `SetStdHandle`, so the MCP handshake
    # check can only run here, and mypy is configured with
    # `platform = "win32"`.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib, per pyproject.toml). Also test the
        # newest, since the dev box runs 3.14 and the two have already
        # differed in behaviour that matters here.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install module-level dependencies only
        # Every per-tool backing package (playwright, duckdb, pyautogui, jupyter,
        # pywinpty, ruamel, tomlkit, jsonpath-ng, send2trash, pillow) is
        # imported *inside* the tool that needs it, so none of them are
        # required to import the app or start the MCP server. CI installs just
        # these five to keep the run to seconds and avoid pulling a browser
        # binary — a real setup still uses `pip install -r requirements.txt`,
        # which installs every one of those per-tool packages unconditionally
        # too, nothing here is meant to be skipped at real install time.
        #
        # Keep mcp's bounds in step with requirements.txt, which explains them.
        # A runner installs fresh every time, so an unbounded range is how CI
        # ends up testing a version no developer here is running.
        #
        # One line rather than a wrapped one: the default shell on a Windows
        # runner is PowerShell, where "\" is not a line continuation (it is a
        # backtick), so the wrapped form this replaced would have run pip with
        # a trailing backslash as an argument.
        run: |
          python -m pip install --upgrade pip
          pip install "anthropic>=1,<2" "mcp[cli]>=2.0,<3" "prompt-toolkit>=3.0.51" "pydantic>=2.0" anyio

      - name: Lint
        # pyproject.toml's [tool.ruff.lint] holds the exemptions, so a clean
        # run is the expected baseline; anything reported is genuinely new.
        run: |
          pip install ruff
          ruff check .

      - name: Type check
        # Runs *here* rather than only by hand because mypy checks against the
        # installed packages, and a runner installs them fresh: this is the step
        # that catches a dependency changing shape underneath the code. It is
        # what would have named every mcp 1.x -> 2.x breakage directly, instead
        # of a bare AttributeError on the first MCP tool call. Config and
        # reasoning live in pyproject.toml's [tool.mypy].
        run: |
          pip install mypy
          mypy .

      - name: Smoke test
        run: python smoke_test.py

  # Guards the one thing about this repo that is genuinely easy to get wrong
  # and impossible to notice: a real secret committed to a public repo.
  #
  secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- the commit-message
          # scan below needs every commit, not just the tip, to be meaningful.
          fetch-depth: 0
      # Complements the tracked-file check below: neither `git grep` on
      # tracked files nor gitleaks' default mode scans commit MESSAGE text at
      # all (confirmed live, 2026-09-25, after a real key ended up in a
      # commit message rather than a file and sailed through both unnoticed).
      # This closes that gap directly. Explicit "exit 0" at the end is
      # deliberate, not decorative: git grep exits 1 for "no match" (the
      # clean/good result), and a pwsh step here fails if $LASTEXITCODE is
      # non-zero at script end even without an explicit exit -- the exact
      # bug already found and fixed in the sibling check below.
      - name: No literal credentials in commit messages
        shell: pwsh
        run: |
          $found = git log --all --format=%B | Select-String -Pattern 'sk-ant-(api03|admin01)-[A-Za-z0-9_-]{20,}' -Quiet
          if ($found) {
            Write-Output '::error::A commit MESSAGE contains what looks like a real Anthropic API key.'
            exit 1
          }
          $found = git log --all --format=%B | Select-String -Pattern '(AKIA|ASIA)[A-Z0-9]{16}' -Quiet
          if ($found) {
            Write-Output '::error::A commit MESSAGE contains what looks like a real AWS access key.'
            exit 1
          }
          $found = git log --all --format=%B | Select-String -Pattern 'gh[pousr]_[A-Za-z0-9]{20,}' -Quiet
          if ($found) {
            Write-Output '::error::A commit MESSAGE contains what looks like a real GitHub token.'
            exit 1
          }
          Write-Output 'no committed credentials found in commit messages'
          exit 0
      - name: No literal credentials in tracked files
        shell: pwsh
        run: |
          # `git grep` is implemented inside git rather than shelling out to a
          # system grep, so its regexes behave the same here; only the control
          # flow around them is PowerShell. A match means a leak, so exit code
          # 0 is the failure case and 1 (no match) is what we want.

          # Anthropic keys, and a bearer token written out instead of the
          # ${VAR} placeholder that .mcp.json and config.toml are meant to use.
          git grep -nIE 'sk-ant-[A-Za-z0-9_-]{20,}' -- .
          if ($LASTEXITCODE -eq 0) {
            Write-Output '::error::An Anthropic API key appears to be committed.'
            exit 1
          }

          # git's -E has no lookahead, so "value that doesn't start with $" is
          # spelled as a first character that is neither $ nor a closing quote.
          # That passes "${ANTHROPIC_API_KEY}" and catches a pasted-in literal.
          # `RESEARCHMESH_MCP_TOKEN` is only the *default* --token-env name;
          # docs explicitly say it's renameable (`--token-env VAR`), so a
          # hardcoded single name would miss a renamed token leaking under
          # its own key. Match any ALL_CAPS key ending in _TOKEN instead.
          git grep -nIE '"(ANTHROPIC_API_KEY|[A-Z_]*_TOKEN)"[[:space:]]*:[[:space:]]*"[^$"][^"]{7,}"' -- '*.json'
          if ($LASTEXITCODE -eq 0) {
            # Single-quoted deliberately: in a double-quoted string PowerShell
            # would expand ${VAR}, printing an empty name in the very message
            # telling you to use one.
            Write-Output '::error::A literal token is committed; use ${VAR} instead.'
            exit 1
          }

          # config.toml's own equivalent: `token_env`/`api_key_env` are meant to
          # hold the NAME of an environment variable, never a secret value
          # itself. A real token pasted in by mistake will contain a lowercase
          # letter somewhere (this project's env-var-name convention is
          # ALL_CAPS_WITH_UNDERSCORES), so that's the signal this checks for.
          git grep -nIE '\b(token_env|api_key_env)\s*=\s*"[^"]*[a-z][^"]*"' -- '*.toml'
          if ($LASTEXITCODE -eq 0) {
            Write-Output '::error::token_env/api_key_env should name an ALL_CAPS environment variable, not a literal value.'
            exit 1
          }

          # The `env = { ANTHROPIC_API_KEY = "$ANTHROPIC_API_KEY" }` inline
          # table (config.toml's stdio-worker examples) is meant to carry a
          # shell expansion, never a literal — the TOML equivalent of the
          # .mcp.json check above.
          git grep -nIE '\benv\s*=\s*\{[^}]*(ANTHROPIC_API_KEY|_TOKEN)\s*=\s*"[^$"][^"]*"' -- '*.toml'
          if ($LASTEXITCODE -eq 0) {
            Write-Output '::error::A literal secret appears to be committed in an inline env table; use "$VAR" instead.'
            exit 1
          }

          Write-Output 'no committed credentials found'
          # Explicit, deliberate exit 0. Without this, the step's exit code
          # falls through to whatever $LASTEXITCODE the last `git grep` above
          # left behind -- and `git grep` exits 1 for "no match", which is
          # the CLEAN result here, not a failure. GitHub's pwsh steps fail
          # the step if $LASTEXITCODE is non-zero at script end even when
          # nothing called `exit` on purpose, so a fully clean tree was
          # failing this job on every run. Confirmed live: this job showed
          # red on every push since at least 2026-09-08, always with only a
          # generic "Process completed with exit code 1" annotation and none
          # of this script's own ::error:: messages -- proof none of the
          # four real checks above were ever actually tripping.
          exit 0

  # General-purpose secret scanner, complementing (not replacing) the
  # targeted regex checks above. Those check THIS app's own token_env/
  # api_key_env/.mcp.json indirection pattern specifically; this instead
  # catches WELL-KNOWN provider-key formats (AWS, GitHub, Slack, Stripe,
  # etc.) anywhere in the tree, which the checks above were never designed
  # to look for. Verified live before adding: does NOT reliably catch an
  # arbitrary custom self-hosted-service token (e.g. an n8n bearer token)
  # with no recognized provider signature -- no regex-based tool does, so
  # the checks above remain the real defense for THIS app's own config
  # surfaces specifically. Runs on ubuntu-latest regardless of the secrets
  # job above being windows-latest -- gitleaks itself is a static binary
  # with no Windows-specific behavior to test here. No license needed
  # (free for personal accounts).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
